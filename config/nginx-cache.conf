proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=packages:10m
                 max_size=50g inactive=7d use_temp_path=off;

log_format cache '$remote_addr [$time_local] "$request" $status '
                 'cache=$upstream_cache_status';

map $upstream_cache_status $log_nocache {
    HIT 0;
    default 1;
}

server {
    listen 80;
    server_name _;
    access_log /dev/stdout cache if=$log_nocache;

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    location / {
        set $upstream_host $uri;
        if ($upstream_host ~ "^/([^/]+)(.*)$") {
            set $upstream_host $1;
            set $upstream_path $2;
        }

        proxy_pass https://$upstream_host$upstream_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_session_reuse off;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 5;
        proxy_next_upstream_timeout 30s;

        proxy_set_header Host $upstream_host;
        proxy_set_header Accept-Encoding "";

        proxy_cache packages;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1m;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_key $upstream_host$upstream_path;

        add_header X-Cache-Status $upstream_cache_status;
    }
}
