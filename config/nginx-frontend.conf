server {
    listen 80;
    server_name _;

    # Disable absolute redirects so Nginx emits relative Location headers (preserving client scheme, host, and port)
    absolute_redirect off;

    # Static assets for OpenWrt Firmware Selector
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to ASU backend
    location /asu/ {
        # CORS preflight & headers for LuCI and cross-origin clients
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;

        proxy_pass http://server:8000/;
        proxy_redirect default;
        proxy_redirect http://$host/ http://$http_host/asu/;
        proxy_redirect / /asu/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";

        # Rewrite paths inside HTML/JS responses to prefix with /asu/
        sub_filter_once off;
        sub_filter_types text/html text/javascript application/javascript application/json;
        sub_filter 'href="/static/' 'href="/asu/static/';
        sub_filter 'src="/static/' 'src="/asu/static/';
        sub_filter 'href="/docs/' 'href="/asu/docs/';
        sub_filter 'href="/redoc/' 'href="/asu/redoc/';
        sub_filter 'href="/stats' 'href="/asu/stats';
        sub_filter 'href="/"' 'href="/asu/"';
        sub_filter 'fetch("/api/' 'fetch("/asu/api/';
        sub_filter 'fetch(`/api/' 'fetch(`/asu/api/';
        sub_filter "url: '/openapi.json'" "url: '/asu/openapi.json'";
        sub_filter "'/docs/oauth2-redirect'" "'/asu/docs/oauth2-redirect'";
        sub_filter "<head>" "<head>\n        <link rel=\"icon\" href=\"/asu/static/logo.png\" />";
    }
}
